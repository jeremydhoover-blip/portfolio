<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
body{background:var(--yellow)}
svg{position:absolute;inset:0}
</style></head><body>
<svg id="s" width="1200" height="1200" viewBox="0 0 1200 1200"></svg>
<script>
const s=document.getElementById('s'),NS='http://www.w3.org/2000/svg';
const add=(t,a,p=s)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
const cx=600,cy=600,step=48;
// rings
const rings=[{r:190,c:'#1155cc',n:'01',t:'Agent'},{r:340,c:'#1155cc',n:'02',t:'Knowledge base'},{r:490,c:'#1155cc',n:'03',t:'Training'}];
// dot field: "hundreds" of designers, adopted closer to the hub
for(let x=step/2;x<1200;x+=step)for(let y=step/2;y<1200;y+=step){
  const d=Math.hypot(x-cx,y-cy); if(d<120) continue;
  let fill,r;
  if(d<rings[0].r){fill='#1155cc';r=13}
  else if(d<rings[1].r){fill='#1155cc';r=11}
  else if(d<rings[2].r){fill='#1155cc';r=8.5}
  else {fill='#101a2d';r=5;}
  add('circle',{cx:x,cy:y,r,fill,opacity:d>=rings[2].r?.35:1});
}
rings.forEach(g=>add('circle',{cx,cy,r:g.r,fill:'none',stroke:'#101a2d','stroke-width':6,'stroke-dasharray':g.r===490?'2 18':'0','stroke-linecap':'round'}));
// hub
add('circle',{cx,cy,r:112,fill:'#101a2d'});
add('circle',{cx,cy,r:112,fill:'none',stroke:'#fff','stroke-width':8});
const sp=add('path',{d:'M600 548 L612 588 L652 600 L612 612 L600 652 L588 612 L548 600 L588 588 Z',fill:'#f6d365'});
// labels on rings
const lab=(ang,g)=>{const a=ang*Math.PI/180,x=cx+g.r*Math.cos(a),y=cy+g.r*Math.sin(a);
  const w=g.t.length*19+110, gr=add('g',{transform:`translate(${x-w/2} ${y-34})`});
  add('rect',{width:w,height:68,rx:34,fill:'#fff',stroke:'#101a2d','stroke-width':5},gr);
  const t=add('text',{x:30,y:45,style:"font:700 26px 'JetBrains Mono';fill:#1155cc"},gr);t.textContent=g.n;
  const t2=add('text',{x:76,y:45,style:"font:700 30px 'Space Grotesk';fill:#101a2d"},gr);t2.textContent=g.t;};
lab(-60,rings[0]);lab(150,rings[1]);lab(35,rings[2]);
</script>
</body></html>
